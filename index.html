<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comptoir de la Bordure — livres et equipement pour les mondes eloignes</title>
    <meta
      name="description"
      content="Comptoir de la Bordure : ouvrages, lames d'energie et reliques, expedies vers les quatre bases."
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="fond-nebuleuse" aria-hidden="true"></div>
    <div class="fond-horizon" id="fond"></div>

    <header class="entete">
      <div class="entete__marque">
        <p class="enseigne" id="enseigne"></p>
        <p class="baseline" id="baseline"></p>
      </div>
      <p class="entete__bases" id="bases"></p>
    </header>

    <main>
      <section class="heros">
        <div class="heros__texte">
          <h1>Equipez votre prochaine traversee.</h1>
          <p id="heros-accroche"></p>
          <p class="heros__livraison" id="heros-livraison"></p>
        </div>
        <figure class="heros__photo">
          <img
            src="./images/panorama.jpg"
            alt="Panorama d'une plaine rocheuse sous un ciel pale"
            loading="eager"
            width="1920"
            height="329"
          />
          <figcaption>Relais Tessara — releve du comptoir</figcaption>
        </figure>
      </section>

      <section class="catalogue" aria-labelledby="titre-catalogue">
        <div class="catalogue__entete">
          <h2 id="titre-catalogue">Le catalogue</h2>
          <p class="compteur" id="compteur" role="status" aria-live="polite"></p>
        </div>

        <div class="filtres">
          <div class="filtres__rayons" id="filtres-rayons" role="group" aria-label="Filtrer par rayon"></div>
          <label class="bascule">
            <input type="checkbox" id="filtre-dispo" />
            <span>Seulement ce qui est disponible</span>
          </label>
        </div>

        <div class="grille-produits" id="grille"></div>
      </section>

      <section class="conseil" aria-labelledby="titre-conseil">
        <div class="conseil__presentation">
          <h2 id="titre-conseil">Demandez conseil</h2>
          <p id="conseil-intro"></p>
          <figure class="conseil__photo">
            <img
              src="./images/coucher.jpg"
              alt="Coucher de soleil sur une plaine desertique"
              loading="lazy"
              width="1024"
              height="816"
            />
            <figcaption>Fin de cycle au comptoir</figcaption>
          </figure>
          <div class="conseil__scene" id="conseil-scene"></div>
        </div>

        <div class="borne">
          <div class="borne__sources" role="radiogroup" aria-label="Choisir la source de reponse">
            <button type="button" class="source source--active" data-source="comptoir" role="radio" aria-checked="true">
              Comptoir
            </button>
            <button type="button" class="source" data-source="galaxy" role="radio" aria-checked="false">
              Expert Galaxy
            </button>
          </div>
          <p class="borne__aide" id="borne-aide"></p>

          <div class="journal" id="journal" role="log" aria-live="polite"></div>

          <div class="suggestions" id="suggestions"></div>

          <form class="saisie" id="saisie">
            <label for="question">Votre demande</label>
            <div class="saisie__ligne">
              <input
                type="text"
                id="question"
                name="question"
                autocomplete="off"
                placeholder="Ex. une lame pour debuter l'entrainement"
              />
              <button type="submit" id="envoyer">Envoyer</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="pied">
      <p id="pied-nom"></p>
      <p class="pied__credit">
        Images : NASA / JPL-Caltech — domaine public
      </p>
      <p id="pied-bases"></p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
